<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net;">
<title>Cek Stok</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E251D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cek Stok">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <b>Cek Stok</b>
    <div class="field"><label>Nama login</label><input class="inp" id="loginId" autocomplete="off" autocapitalize="off"></div>
    <div class="field"><label>Kata sandi</label><input class="inp" type="password" id="loginPassword" autocomplete="off"></div>
    <button class="btn" id="btnLogin">Masuk</button>
    <p class="hint" id="loginHint"></p>
  </div>
</div>

<div id="appShell" hidden>
  <header>
    <b>Cek Stok</b>
    <span class="spacer"></span>
    <button id="btnKeluar">Keluar</button>
  </header>
  <main>
    <div class="ekatalog" id="ekatalog">
      <div class="judul"><b id="ekJudul">Katalog</b><span id="ekSub"></span></div>
      <div class="strip" id="ekStrip"></div>
    </div>
    <div class="search"><input id="cari" placeholder="Cari kode, merek, tipe…"></div>
    <div class="filters">
      <select class="inp" id="fKategori"></select>
      <select class="inp" id="fMerek"></select>
      <select class="inp" id="fTipe"></select>
      <select class="inp" id="fUkuran"></select>
      <select class="inp" id="fWarna"></select>
      <button class="reset" id="btnResetFilter" hidden>× Hapus filter</button>
    </div>
    <div class="katalog" id="katalog" hidden></div>
    <div class="ringkas" id="ringkas" hidden></div>
    <div id="list"></div>
  </main>
</div>

<div id="ekViewer" class="viewer" hidden>
  <header>
    <button id="ekTutup" class="icon" aria-label="Tutup">‹</button>
    <b id="ekViewerJudul">Katalog</b>
    <span class="spacer"></span>
    <span id="ekHal" class="hal"></span>
  </header>
  <div class="pages" id="ekPages"></div>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
